<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::title}, ~{::#content})}">
<head>
    <title>Iniciar Sesión - AgendaPro</title>
</head>
<body>
<div id="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">🔐</span>
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder a tu agenda segura</p>
            </div>

            <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Usuario o Email</label>
                    <input type="text" id="username" class="form-input" required placeholder="admin o tu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="btnLogin">Entrar al Sistema</button>
            </form>

            <div class="auth-footer">
                <p>¿No tienes una cuenta? <a th:href="@{/register}">Regístrate aquí</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
