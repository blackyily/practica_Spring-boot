<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Agenda Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="brand-icon">📒</span>
                <span class="brand-title">AgendaPro <strong>Spring Boot</strong></span>
            </div>
            <nav class="nav-links">
                <a th:href="@{/agenda}" class="nav-link">Contactos</a>
                <a th:href="@{/swagger-ui/index.html}" target="_blank" class="nav-link badge-link">Swagger UI 🚀</a>
                <a th:href="@{/h2-console}" target="_blank" class="nav-link badge-link">H2 Console 🗄️</a>
                <div id="authNavButtons" class="auth-buttons">
                    <!-- Dinámico vía JavaScript y Thymeleaf -->
                    <a th:href="@{/login}" id="navLoginBtn" class="btn btn-outline">Ingresar</a>
                    <a th:href="@{/register}" id="navRegisterBtn" class="btn btn-primary">Registrarse</a>
                    <button id="navLogoutBtn" class="btn btn-danger" style="display:none;" onclick="logout()">Cerrar Sesión</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div th:replace="${content}">
            <p>Contenido por defecto...</p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>© 2026 AgendaPro Backend Modular - Spring Boot 3 & Spring Security & JWT.</p>
            <div class="latency-indicator" id="processTimeBadge">
                <span>Header X-Process-Time activo</span>
            </div>
        </div>
    </footer>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
